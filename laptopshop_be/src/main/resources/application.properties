spring.application.name=laptopshop_be
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LaptopShopDB;encrypt=true;trustServerCertificate=true}

spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

server.port=8080
server.shutdown=graceful

# Security & JWT Configuration (Tasks 5 & 6)
security.jwt.secret=${JWT_SECRET:}
security.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
security.jwt.cookie-secure=${COOKIE_SECURE:false}
