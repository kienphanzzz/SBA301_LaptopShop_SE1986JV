spring.application.name=laptopshop_be
spring.config.import=optional:file:.env[.properties],optional:file:./.env[.properties],optional:file:laptopshop_be/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}

spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.show-sql=true

server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
server.shutdown=graceful
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:2}
spring.jmx.enabled=false

security.jwt.secret=${JWT_SECRET:}
security.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
security.jwt.cookie-secure=${COOKIE_SECURE:false}

# CORS: danh sach origin cho phep, cach nhau boi dau phay
# Dev: http://localhost:5173
# Production: https://your-app.vercel.app
web.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
